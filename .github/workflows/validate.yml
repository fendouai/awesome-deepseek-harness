name: validate
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate data registries
        run: python3 scripts/validate.py --strict

      - name: Check repository links
        run: python3 scripts/check-links.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify README tables are in sync
        run: |
          python3 scripts/generate-readme.py
          git diff --exit-code -- README.md README.zh-CN.md

      - name: Verify docs are in sync
        run: |
          python3 scripts/generate-docs.py
          git diff --exit-code -- docs/
