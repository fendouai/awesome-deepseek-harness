{% extends "base.html" %}

{% block extrahead %}
  {% if page and page.meta and page.meta.keywords %}
  <meta name="keywords" content="{{ page.meta.keywords }}">
  {% else %}
  <meta name="keywords" content="deepseek harness, dsh, ai agent, plugin, awesome">
  {% endif %}
  <meta name="robots" content="index, follow">
  <meta property="og:site_name" content="Awesome DeepSeek Harness">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{% if page %}{{ page.title }} · Awesome DeepSeek Harness{% endif %}">
  {% if page and page.meta and page.meta.description %}
  <meta property="og:description" content="{{ page.meta.description }}">
  {% endif %}
  <meta property="og:url" content="{{ page.canonical_url }}">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{% if page %}{{ page.title }} · Awesome DeepSeek Harness{% endif %}">
  {% if page and page.meta and page.meta.description %}
  <meta name="twitter:description" content="{{ page.meta.description }}">
  {% endif %}
{% endblock %}
